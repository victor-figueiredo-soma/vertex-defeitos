[project]
name = "vertex-defeitos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "google-cloud-aiplatform>=1.161.0",
    "google-cloud-firestore>=2.28.0",
    "google-cloud-pubsub>=2.39.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.13.0",
    "gunicorn>=26.0.0",
    "msal>=1.37.0",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# permite 'import app' / 'import config' a partir da raiz do repo
pythonpath = ["."]
testpaths = ["tests"]
